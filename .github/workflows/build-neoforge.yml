name: Build NeoForge 1.21.1

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-neoforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Build NeoForge 1.21.1
        run: ./gradlew :neoforge:build --no-daemon --stacktrace --warning-mode=all

      - name: List built JARs
        if: always()
        run: find neoforge/build/libs -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || true

      - name: Upload NeoForge mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sable-neoforge-1.21.1
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
